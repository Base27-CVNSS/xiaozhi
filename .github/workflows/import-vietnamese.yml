name: Nhập nền tảng XiaoZhi tiếng Việt

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Lấy commit khởi tạo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Nhập upstream và áp dụng bản Việt hóa
        env:
          EXPECTED_BOOTSTRAP_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git remote add upstream https://github.com/78/xiaozhi-esp32.git
          git fetch --depth=1 upstream dd99da00dc4c89ed4ab07fcec038c03f13f4de50
          git switch --detach FETCH_HEAD
          printf '%s' '' | base64 --decode > /tmp/xiaozhi-vietnamese.patch
          git am /tmp/xiaozhi-vietnamese.patch
          git push --force-with-lease=refs/heads/main:${EXPECTED_BOOTSTRAP_SHA} origin HEAD:main
